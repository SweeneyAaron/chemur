[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "chemur"
version = "0.1.0"
description = "Biomolecular interaction detection and docked-pose rescoring, with a Python API, a CLI, and a C++ geometry core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Sweeney", email = "ucbtasw@ucl.ac.uk" }]
maintainers = [{ name = "Aaron Sweeney", email = "ucbtasw@ucl.ac.uk" }]
keywords = [
  "structural-biology",
  "protein-ligand",
  "molecular-interactions",
  "hydrogen-bond",
  "docking",
  "rescoring",
  "cheminformatics",
  "mmcif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  # Apache-2.0 and a 40 KB pure-Python wheel, so --protonate works out of the box.
  # It does cap the whole install at rdkit <2026 and pulls in loguru; revisit when
  # dimorphite_dl lifts that bound.
  "dimorphite_dl>=2",
  "gemmi>=0.6",
  "numpy>=1.23",
  "PyYAML>=6",
  "rdkit>=2023.9",
]

[project.optional-dependencies]
# Empty alias: dimorphite_dl is a hard dependency now, but removing the extra outright
# would make an existing `pip install chemur[protonation]` warn that it does not exist.
protonation = []
trajectory = ["MDAnalysis>=2.4"]
dataframe = ["pandas>=1.5"]
all = ["chemur[protonation,trajectory,dataframe]"]
test = ["pytest>=7", "chemur[dataframe]"]

[project.scripts]
chemur = "chemur.cli:main"

[project.urls]
Homepage = "https://github.com/SweeneyAaron/chemur"
Source = "https://github.com/SweeneyAaron/chemur"
Issues = "https://github.com/SweeneyAaron/chemur/issues"
"ChimeraX plugin" = "https://github.com/SweeneyAaron/chimerax-chemur"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.18"
cmake.source-dir = "."
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/chemur"]
# The sdist otherwise sweeps in everything not gitignored. paper/ in particular
# is 1.6 MB of manuscript figures that no user of the library needs.
sdist.exclude = [
  ".github",
  "paper",
  "test_data",
  "wheels",
  "dist",
  "build",
  "**/.DS_Store",
  "**/__pycache__",
  "*.egg-info",
  "*.whl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
# PyPy and musllinux are skipped because RDKit — a hard dependency — publishes no
# wheels for them, so the test venv could not be provisioned. There are no 32-bit
# NumPy/RDKit wheels for Python 3.10+ either.
skip = ["pp*", "*-musllinux_*", "*_i686", "*-win32"]
build-frontend = "build"
build-verbosity = 1
test-requires = ["pytest"]
# cibuildwheel tests both halves of a universal2 wheel, running the x86_64 half under
# Rosetta. pip installs the test venv's numpy/rdkit/gemmi natively, so they are arm64-only
# wheels and that half fails on import -- a property of the dependencies, not of our x86_64
# slice, which lipo confirms is a valid fat-binary slice at the same 11.0 floor. The arm64
# half is still tested in full, as is every Linux and Windows wheel.
test-skip = "*-macosx_universal2:x86_64"
test-command = [
  # core.py falls back to the pure-Python core on ImportError, silently. Without
  # this assertion a wheel whose CMake step failed would import fine, pass every
  # functional test, and ship 10-100x slower than intended.
  "python -c \"from chemur.core import USING_CPP_CORE; assert USING_CPP_CORE, 'FATAL: wheel fell back to the pure-Python core'\"",
  # profile.py swallows a failed resource lookup and returns the hard-coded
  # DEFAULT_PROFILE, so a missing profiles/default.yaml is otherwise invisible.
  # The rule count is checked against the interaction-type registry rather than a
  # literal, so adding a detector cannot leave this assertion stale (it silently
  # asserted 15 for the whole of the 22-rule series).
  "python -c \"from chemur.profile import load_profile; from chemur.interaction_types import INTERACTION_TYPES; p = load_profile('default'); assert p['name'] == 'default' and len(p['rules']) == len(INTERACTION_TYPES), p\"",
  "python -m pytest {project}/tests -q",
]

[tool.cibuildwheel.linux]
# rdkit dropped manylinux_2_17 wheels at 2024.3.3 and gemmi at 0.7.3, so a glibc-2.17
# container cannot install this project's own dependencies: pip falls back to building
# rdkit from source and the test phase dies. 2.28 is cibuildwheel's default and the floor
# rdkit itself requires, so this excludes no system that could have run chemur anyway.
manylinux-x86_64-image = "manylinux_2_28"

# MACOSX_DEPLOYMENT_TARGET and CIBW_ARCHS are set in .github/workflows/release.yml,
# not here: macOS ships as a single universal2 wheel, whose arm64 slice forces an 11.0
# floor, while Linux and Windows take no deployment target at all.

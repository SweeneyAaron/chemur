name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target: no cross-compiling, so cibuildwheel's
          # test phase actually executes on the architecture it built for.
          - { os: ubuntu-latest, archs: x86_64, deploy: "" }
          - { os: macos-13, archs: x86_64, deploy: "10.13" }
          - { os: macos-14, archs: arm64, deploy: "11.0" }
          - { os: windows-latest, archs: AMD64, deploy: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # Per-arch: 10.13 is a valid floor for x86_64 but illegal on arm64.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI versions are immutable, so a tag/version mismatch cannot be undone: pushing
      # v0.1.1 against a pyproject still reading 0.1.0 would republish 0.1.0 and burn the
      # tag. Fail before anything is built.
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/}
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG does not match pyproject version v$V"; exit 1; }

      - run: python -m pip install --upgrade pip build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: ./dist/*.tar.gz

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Put a required reviewer on this environment: PyPI versions are immutable,
    # so this approval gate is the last chance to stop a bad upload.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

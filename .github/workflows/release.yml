name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, archs: x86_64, deploy: "" }
          # macOS Intel coverage is a universal2 wheel cross-compiled on the arm64
          # runner, not a native x86_64 build. GitHub retired the free macos-13 Intel
          # runner, and the replacements (macos-15-intel / *-large) are larger runners,
          # which are billed even on public repositories. universal2 keeps Intel Macs
          # on a binary wheel for free -- ChimeraX's bundled Python accepts the
          # macosx_11_0_universal2 tag on both architectures. The x86_64 slice is
          # therefore built but not executed in CI; the core is header-only STL, so
          # there is no arch-specific native dependency to go wrong.
          - { os: macos-15, archs: universal2, deploy: "11.0" }
          - { os: windows-latest, archs: AMD64, deploy: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # 11.0 is the floor for anything containing an arm64 slice.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI versions are immutable, so a tag/version mismatch cannot be undone: pushing
      # v0.1.1 against a pyproject still reading 0.1.0 would republish 0.1.0 and burn the
      # tag. Fail before anything is built.
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/}
          [ "v$V" = "$TAG" ] || { echo "::error::tag $TAG does not match pyproject version v$V"; exit 1; }

      - run: python -m pip install --upgrade pip build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: ./dist/*.tar.gz

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Put a required reviewer on this environment: PyPI versions are immutable,
    # so this approval gate is the last chance to stop a bad upload.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
